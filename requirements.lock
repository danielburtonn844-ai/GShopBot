# G Shop Bot · 完整依赖锁（含 SHA-256 哈希）
#
# P2-16：依赖哈希锁定。requirements.txt 只写顶层直接依赖，传递依赖
# （httpcore / h11 / anyio / idna / certifi / typing-extensions）不写进去，
# 每次 pip install 都会解析到最新版——上游一次恶意/破坏性发版即可远程
# 改变运行行为（供应链攻击的典型路径）。本文件把整棵依赖树连同每个
# wheel 的 SHA-256 全部钉死。
#
# 安装（校验哈希，任何一个字节不符即失败）：
#   pip install --require-hashes -r requirements.lock
# CI 用这个文件；本地开发图省事可以继续用 requirements.txt。
#
# 重新生成：
#   pip download -d /tmp/w -r requirements.txt
#   # 再按下方格式把 sha256 填进来
#   # sha256sum /tmp/w/*.whl
#
# 归档时间：v2.8.0
# Python：>=3.10（CI 矩阵 3.10 / 3.11 / 3.12）
# 平台：纯 Python wheel（py3-none-any），无编译依赖，任意平台通用。

