name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # P2-16: runtime deps pinned by hash. pyproject.toml only lists direct
      # deps, transitive ones drift to latest on every install, so one bad
      # upstream release silently changes runtime behaviour.
      - name: Install runtime dependencies (hash-locked)
        run: pip install --require-hashes -r requirements.lock

      # pytest 必须装：test_p2_9_money.py 是 pytest 原生文件，顶层 import pytest，
      # 缺了它这一步直接 ImportError 退出码 1（曾经让 CI 整条变红）。
      - name: Install dev tools
        run: pip install ruff mypy coverage pytest

      - name: Lint (ruff)
        run: ruff check main.py gshop tests

      - name: Syntax check
        run: python -m compileall -q main.py gshop tests

      # P2-16: normal mode must be clean (hard gate).
      - name: Type check (mypy)
        run: mypy gshop main.py

      # P2-16: strict mode gates defect classes only; annotation-completeness
      # codes are excluded on purpose (see pyproject.toml).
      - name: Type check (mypy --strict, defect classes only)
        run: |
          mypy gshop main.py --strict \
            --disable-error-code=no-untyped-def \
            --disable-error-code=no-untyped-call \
            --disable-error-code=type-arg

      - name: Self-check (7231 assertions, no network)
        run: python tests/test_bot_full.py

      - name: Issue regression tests
        run: python tests/verify_issues.py

      - name: Extra branch coverage tests
        run: python tests/test_extra.py

      - name: Deep coverage tests
        run: python tests/test_coverage_boost.py

      - name: P2 fix regression tests
        run: python tests/test_p2_fixes.py
      # v2.8.1: 4 个业务硬伤（补单入口 / 负价兜底 / 拉群接管 / 丢更新）
      - name: v2.8.1 fix regression tests
        run: python tests/test_v281_fixes.py

      - name: P2-9 Decimal money tests
        run: python tests/test_p2_9_money.py

      - name: Version consistency tests
        run: python tests/test_version_consistency.py

      - name: Deep coverage suite 1
        run: python tests/test_cov_deep.py

      - name: Deep coverage suite 2
        run: python tests/test_cov_deep2.py

      - name: Deep coverage suite 3
        run: python tests/test_cov_deep3.py

      - name: Concurrency bench (real lock contention)
        run: python tests/bench_concurrency.py

      # P2-16: coverage gate raised 75% -> 85%, ten suites in one session.
      - name: Coverage (fail under 85%)
        run: |
          coverage erase
          coverage run --source=gshop,main tests/test_bot_full.py
          coverage run -a --source=gshop,main tests/test_extra.py
          coverage run -a --source=gshop,main tests/test_coverage_boost.py
          coverage run -a --source=gshop,main tests/verify_issues.py
          coverage run -a --source=gshop,main tests/test_p2_fixes.py
          coverage run -a --source=gshop,main tests/test_v281_fixes.py
          coverage run -a --source=gshop,main tests/test_p2_9_money.py
          coverage run -a --source=gshop,main tests/test_cov_deep.py
          coverage run -a --source=gshop,main tests/test_cov_deep2.py
          coverage run -a --source=gshop,main tests/test_cov_deep3.py
          coverage report --fail-under=85 --skip-covered

      - name: Import smoke test
        run: |
          BOT_TOKEN=1:test ADMIN_ID=100000000 python -c "
          import sys
          sys.path.insert(0, '.')
          from gshop import runtime
          from gshop import chain_watch, grab_service, shop_service, models
          print('imports ok, VERSION =', runtime.VERSION)
          "
